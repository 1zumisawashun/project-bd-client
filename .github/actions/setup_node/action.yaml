name: Setup Node
description: Node 環境を構築し、依存関係をインストールします。

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: ".node-version"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci
