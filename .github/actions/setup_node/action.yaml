name: Setup Node
description: Node 環境を構築し、依存関係をインストールします。

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".node-version"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci
