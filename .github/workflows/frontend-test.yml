name: frontend test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/action-setup@v4
      - name: setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test
